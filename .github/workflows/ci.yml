name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: bash -n install.sh scripts/build.sh
      - run: bash scripts/build.sh
      - run: test "$(lipo -archs dist/FinderSideButtons.app/Contents/MacOS/FinderSideButtons)" = arm64
